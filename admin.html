<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SIMANTRI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 22px; color: #333; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .controls input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #0056b3; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-info { background: #17a2b8; color: white; padding: 5px 10px; font-size: 12px; }
        
        .table-container { background: white; border-radius: 8px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; color: #333; }
        tr:hover { background: #f1f1f1; }
        
        /* Badge Status */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }

        /* Modal Popup Detail */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #888; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
        .detail-item { background: #f9f9f9; padding: 8px; border-radius: 4px; }
        .detail-item strong { display: block; color: #555; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard Admin SIMANTRI</h1>
        <div>
            <a href="index.html" class="btn btn-primary">+ Isi Form Baru</a>
            <button onclick="exportCSV()" class="btn btn-success">📊 Export ke Excel/CSV</button>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari berdasarkan Nama Lengkap atau NIK...">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Waktu Submit</th>
                    <th>NIK</th>
                    <th>Nama Lengkap</th>
                    <th>Unit Kerja</th>
                    <th>Status STR</th>
                    <th>Status SIP</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Popup Detail -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Detail Data SIMANTRI</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody" class="detail-grid">
                <!-- Detail lengkap diisi via JavaScript -->
            </div>
        </div>
    </div>

<script>
    // 1. Konfigurasi Supabase
    const supabaseUrl = 'https://kyxclotcblbkzrilldru.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5eGNsb3RjYmxia3pyaWxsZHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIzMjcsImV4cCI6MjEwMTg1ODMyN30.aUrEK8JLCia3vkg8nxin0wmgJw_o92Kia2T5zZM7Gwo';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let allData = []; // Menyimpan data di memori untuk pencarian/filter cepat

    // 2. Ambil Data dari Supabase
    async function loadData() {
        const { data, error } = await supabase
            .from('formulir_simantri')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            alert('Gagal mengambil data: ' + error.message);
            console.error(error);
            return;
        }

        allData = data;
        renderTable(allData);
    }

    // 3. Render Tabel Ringkas
    function renderTable(dataList) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (dataList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Tidak ada data ditemukan.</td></tr>';
            return;
        }

        dataList.forEach(item => {
            const dateFormatted = new Date(item.created_at).toLocaleString('id-ID');
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dateFormatted}</td>
                <td>${item.nik || '-'}</td>
                <td><strong>${item.nama_lengkap || '-'}</strong></td>
                <td>${item.unit_kerja || '-'}</td>
                <td><span class="badge ${item.status_str === 'Aktif' ? 'badge-active' : 'badge-inactive'}">${item.status_str || '-'}</span></td>
                <td><span class="badge ${item.status_sip === 'Aktif' ? 'badge-active' : 'badge-inactive'}">${item.status_sip || '-'}</span></td>
                <td>
                    <button class="btn btn-info" onclick="showDetail('${item.id}')">Detail</button>
                    <button class="btn btn-danger" onclick="deleteData('${item.id}', '${item.nama_lengkap}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 4. Fitur Pencarian / Filter
    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(item => 
            (item.nama_lengkap && item.nama_lengkap.toLowerCase().includes(query)) ||
            (item.nik && item.nik.toLowerCase().includes(query))
        );
        renderTable(filtered);
    }

    // 5. Tampilkan Modal Detail Lengkap
    function showDetail(id) {
        const item = allData.find(d => d.id === id);
        if (!item) return;

        document.getElementById('modalTitle').innerText = 'Detail: ' + (item.nama_lengkap || 'Nakes');
        
        const modalBody = document.getElementById('modalBody');
        
        // Memetakan semua kolom database ke tampilan rapi
        const fields = [
            { label: 'Waktu Input', val: new Date(item.created_at).toLocaleString('id-ID') },
            { label: 'NIK', val: item.nik },
            { label: 'Nama Lengkap', val: item.nama_lengkap },
            { label: 'Jenis Kelamin', val: item.jenis_kelamin },
            { label: 'Tempat, Tgl Lahir', val: `${item.tempat_lahir || '-'}, ${item.tanggal_lahir || '-'}` },
            { label: 'Alamat KTP', val: item.alamat_ktp },
            { label: 'Nomor STR', val: item.nomor_str },
            { label: 'Status STR', val: item.status_str },
            { label: 'Nomor SIP', val: item.nomor_sip },
            { label: 'Status SIP', val: item.status_sip },
            { label: 'Masa Berlaku SIP', val: item.masa_berlaku_sip },
            { label: 'Unit Kerja', val: item.unit_kerja },
            { label: 'Alamat Unit Kerja', val: item.alamat_unit_kerja },
            { label: 'Desa/Kelurahan', val: item.desa_kelurahan },
            { label: 'Jam Operasional', val: item.jam_operasional },
            { label: 'Status SatuSehat', val: item.status_satusehat },
            { label: 'SOP Pelayanan', val: item.sop_pelayanan },
            { label: 'SOP Profesi', val: item.sop_profesi },
            { label: 'SOP Etika', val: item.sop_etika },
            { label: 'SDMK Named', val: item.sdmk_named },
            { label: 'SDMK Nakes', val: item.sdmk_nakes },
            { label: 'SDMK Admin', val: item.sdmk_admin },
            { label: 'Catatan Rekomendasi', val: item.catatan }
        ];

        modalBody.innerHTML = fields.map(f => `
            <div class="detail-item">
                <strong>${f.label}</strong>
                <span>${f.val || '-'}</span>
            </div>
        `).join('');

        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    // 6. Hapus Data
    async function deleteData(id, nama) {
        if (!confirm(`Apakah Anda yakin ingin menghapus data "${nama}"?`)) return;

        const { error } = await supabase.from('formulir_simantri').delete().eq('id', id);

        if (error) {
            alert('Gagal menghapus: ' + error.message);
        } else {
            alert('Data berhasil dihapus.');
            loadData(); // Reload tabel
        }
    }

    // 7. Export ke CSV / Excel
    function exportCSV() {
        if (allData.length === 0) {
            alert('Tidak ada data untuk di-export.');
            return;
        }

        const headers = Object.keys(allData[0]).join(',');
        const rows = allData.map(row => 
            Object.values(row).map(val => `"${(val || '').toString().replace(/"/g, '""')}"`).join(',')
        );

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers, ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Data_SIMANTRI_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Jalankan pertama kali saat halaman dimuat
    loadData();
</script>

</body>
</html>
