<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir SIMANTRI</title>
    <!-- Memanggil library Supabase langsung dari internet (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Formulir SIMANTRI</h2>
    
    <!-- Formulir -->
    <form id="formSimantri">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <button type="submit">Kirim Data</button>
    </form>

    <script>
        // 1. Ganti dengan URL dan Anon Key dari Project Supabase Anda
        const supabaseUrl = 'https://kyxclotcblbkzrilldru.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5eGNsb3RjYmxia3pyaWxsZHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIzMjcsImV4cCI6MjEwMTg1ODMyN30.aUrEK8JLCia3vkg8nxin0wmgJw_o92Kia2T5zZM7Gwo';
        
        // Inisialisasi koneksi
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Menangkap kejadian saat tombol submit ditekan
        document.getElementById('formSimantri').addEventListener('submit', async function(event) {
            event.preventDefault(); // Mencegah halaman reload

            // Mengambil nilai dari inputan
            const namaValue = document.getElementById('nama').value;
            const emailValue = document.getElementById('email').value;

            // 3. Mengirim data ke tabel 'formulir_simantri' di Supabase
            const { data, error } = await supabase
                .from('formulir_simantri')
                .insert([
                    { nama: namaValue, email: emailValue }
                ]);

            // Mengecek apakah ada error atau berhasil
            if (error) {
                alert('Gagal mengirim data: ' + error.message);
                console.error(error);
            } else {
                alert('Data berhasil disimpan ke Supabase!');
                document.getElementById('formSimantri').reset(); // Mengosongkan form
            }
        });
    </script>

</body>
</html>
