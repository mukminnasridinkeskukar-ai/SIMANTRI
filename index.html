<script>
    // 1. Konfigurasi Supabase
    const supabaseUrl = 'https://kyxclotcblbkzrilldru.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5eGNsb3RjYmxia3pyaWxsZHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODIzMjcsImV4cCI6MjEwMTg1ODMyN30.aUrEK8JLCia3vkg8nxin0wmgJw_o92Kia2T5zZM7Gwo';

    // 2. Buat instansi client menggunakan nama variabel 'supabaseClient'
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // 3. Fungsi Kirim Data
    document.getElementById('formSimantri').addEventListener('submit', async function(event) {
        event.preventDefault(); // Mencegah reload halaman
        
        const btn = document.getElementById('btnSubmit');
        btn.textContent = "Mengirim...";
        btn.disabled = true;

        // Mengambil semua data form otomatis berdasarkan atribut "name"
        const formData = new FormData(event.target);
        const formObject = Object.fromEntries(formData.entries());

        // Mengubah input tanggal kosong menjadi null agar tidak error di PostgreSQL
        if (formObject.tanggal_lahir === "") formObject.tanggal_lahir = null;
        if (formObject.masa_berlaku_sip === "") formObject.masa_berlaku_sip = null;

        // 4. Kirim ke Supabase menggunakan 'supabaseClient'
        const { error } = await supabaseClient.from('formulir_simantri').insert([formObject]);

        if (error) {
            alert('Gagal mengirim data: ' + error.message);
            console.error(error);
        } else {
            alert('Data berhasil disimpan!');
            event.target.reset(); // Kosongkan form
        }

        btn.textContent = "Kirim Data SIMANTRI";
        btn.disabled = false;
    });
</script>
